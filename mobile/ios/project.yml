name: SFERA
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SFERA:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: SFERATunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sfera.client
        CODE_SIGN_ENTITLEMENTS: App/SFERA.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SFERA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "$(SFERA_APP_PROFILE)"
  SFERATunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes: ["*.entitlements", Info.plist]
      - path: Shared
        excludes: ["DirectSites.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sfera.client.tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/SFERA.entitlements
        INFOPLIST_FILE: Tunnel/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Bridge.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SFERA_CORE_DIR)/bindings/mobile/include"]
        OTHER_LDFLAGS: ["$(inherited)", "$(SFERA_NATIVE_LIB)", "-lresolv"]
        PROVISIONING_PROFILE_SPECIFIER: "$(SFERA_TUNNEL_PROFILE)"
schemes:
  SFERA:
    build:
      targets:
        SFERA: all
    archive:
      config: Release
